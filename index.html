<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>slide puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===== colour variables (only ONE accent) ===== */
:root {
  --bg: #111111;      /* page background */
  --tile: #1e1e1e;    /* tile fill */
  --line: #2a2a2a;    /* thin outlines */
  --text: #e6e6e6;    /* main text */
  --muted: #777777;   /* secondary text */
  --accent: #7ee787;  /* selected, solved, score */
  --board-size: min(92vw, 56vh, 520px);
  --fade: 0.6s;       /* blind-mode fade time (set from CONFIG in the script) */
}

/* ===== base ===== */
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  text-transform: lowercase;
}
body[data-screen="game"], body[data-screen="solved"], body[data-screen="timeup"] { overflow: hidden; }

/* ===== screens: only one visible at a time (controlled by data-screen on <body>) ===== */
.screen { display: none; }
body[data-screen="menu"] #menu { display: flex; }
body[data-screen="game"] #game,
body[data-screen="solved"] #game,
body[data-screen="timeup"] #game { display: flex; }
body[data-screen="solved"] #solved { display: flex; }
body[data-screen="timeup"] #timeup { display: flex; }
.hidden { display: none !important; }

/* ===== buttons ===== */
.btn {
  min-height: 44px; padding: 0 16px;
  background: transparent; color: var(--text);
  border: 1px solid var(--line); border-radius: 6px;
  font: inherit; font-size: 14px; text-transform: lowercase;
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.selected { border-color: var(--accent); color: var(--accent); }

/* ===== menu ===== */
#menu {
  flex-direction: column; align-items: center; justify-content: center;
  min-height: 100%; padding: 24px 16px; gap: 18px;
}
#menu h1 { margin: 0; font-size: 28px; font-weight: 600; }
.subtitle { color: var(--muted); font-size: 13px; margin-top: -10px; }
.row { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.row > label { color: var(--muted); font-size: 12px; }
.row > label span { opacity: .6; }
.group { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
#blind-rows { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.minutes-input {
  width: 96px; min-height: 44px; padding: 0 10px; text-align: center;
  background: transparent; color: var(--text);
  border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 14px;
}
.minutes-input::placeholder { color: var(--muted); }
#start-btn { min-width: 200px; font-size: 16px; border-color: var(--accent); color: var(--accent); }
#best-line { color: var(--muted); font-size: 12px; min-height: 16px; }

/* ===== game ===== */
#game {
  flex-direction: column; align-items: center; justify-content: center;
  height: 100%; gap: 12px; padding: 12px;
}
#hud {
  width: var(--board-size); display: flex; justify-content: space-between; gap: 8px;
  color: var(--muted); font-size: 13px; flex-wrap: wrap;
}
#hud .low { color: var(--accent); }
#score { color: var(--accent); }
#info { width: var(--board-size); text-align: center; color: var(--muted); font-size: 12px; min-height: 16px; }
#info.study { color: var(--accent); }

/* pressure bar: fills up while you hesitate, the board moves when it is full */
#pressure { width: var(--board-size); height: 2px; background: var(--line); }
#pressure-bar { height: 100%; width: 0; background: var(--muted); transition: width 100ms linear; }
#pressure.hot #pressure-bar { background: var(--accent); }

#board {
  position: relative; width: var(--board-size); aspect-ratio: 1;
  container-type: size;
  touch-action: none;           /* we handle drag and swipe ourselves */
  user-select: none; -webkit-user-select: none;
}
.tile {
  position: absolute; left: 0; top: 0; padding: 2px;
  width: calc(100% / var(--n)); height: calc(100% / var(--n));
  /* --x/--y = grid position, --dx/--dy = live drag offset in px */
  transform: translate(calc(var(--x) * 100% + var(--dx, 0px)), calc(var(--y) * 100% + var(--dy, 0px)));
  transition: transform 150ms cubic-bezier(.2, .8, .2, 1);
  will-change: transform;
  cursor: grab;
}
.tile.dragging { transition: none; z-index: 2; cursor: grabbing; }
.tile-face {
  width: 100%; height: 100%; display: grid; place-items: center;
  background: var(--tile); border: 1px solid var(--line); border-radius: 6px;
}
.tile-number {
  font-size: calc(100cqw / var(--n) * 0.38); font-weight: 600;
  transition: opacity var(--fade); opacity: 1;
}
/* blind mode: numbers fade out; .peek brings them back */
#board.blind .tile-number { opacity: 0; }
#board.blind.peek .tile-number { opacity: 1; }
/* solved state */
#board.solved .tile-face { border-color: var(--accent); }
#board.solved .tile-number { color: var(--accent); opacity: 1; }

#controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
#go-btn { border-color: var(--accent); color: var(--accent); }
#hint { color: #555; font-size: 11px; text-align: center; max-width: var(--board-size); }

/* ===== end overlays (solved / timeup) ===== */
.overlay {
  position: fixed; inset: 0; background: rgba(17,17,17,.9);
  flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px;
  text-align: center;
}
.overlay h2 { margin: 0; font-size: 30px; font-weight: 600; }
#solved h2, #final-score { color: var(--accent); }
#final-score { font-size: 22px; }
.overlay p { margin: 0; color: var(--muted); font-size: 14px; }
.overlay .group { margin-top: 10px; }
#new-best { color: var(--accent); font-size: 14px; }

@media (prefers-reduced-motion: reduce) {
  .tile, .tile-number, #pressure-bar { transition: none; }
}
</style>
</head>
<body data-screen="menu">

<!-- ================= MENU ================= -->
<section id="menu" class="screen">
  <h1>slide puzzle</h1>
  <div class="subtitle">train your brain under pressure</div>

  <div class="row">
    <label>timer</label>
    <div class="group">
      <button class="btn option-btn" data-group="timer" data-value="off">off</button>
      <button class="btn option-btn" data-group="timer" data-value="on">on</button>
    </div>
  </div>

  <div class="row hidden" id="minutes-row">
    <label>minutes</label>
    <div class="group">
      <button class="btn option-btn" data-group="preset" data-value="1">1</button>
      <button class="btn option-btn" data-group="preset" data-value="3">3</button>
      <button class="btn option-btn" data-group="preset" data-value="5">5</button>
      <button class="btn option-btn" data-group="preset" data-value="10">10</button>
      <input id="minutes-input" class="minutes-input" type="number" min="1" max="99" inputmode="numeric" placeholder="custom">
    </div>
  </div>

  <div class="row">
    <label>difficulty</label>
    <div class="group">
      <button class="btn option-btn" data-group="diff" data-value="easy">easy</button>
      <button class="btn option-btn" data-group="diff" data-value="hard">hard</button>
      <button class="btn option-btn" data-group="diff" data-value="god">god</button>
    </div>
  </div>

  <div class="row">
    <label>board size</label>
    <div class="group">
      <button class="btn option-btn" data-group="size" data-value="3">3x3</button>
      <button class="btn option-btn" data-group="size" data-value="4">4x4</button>
      <button class="btn option-btn" data-group="size" data-value="5">5x5</button>

        <button class="btn option-btn" data-group="blindsecs" data-value="15">15</button>

      </div>
    </div>
    <div class="row">
      <label>peeks <span>per game</span></label>
      <div class="group">
        <button class="btn option-btn" data-group="peeks" data-value="0">0</button>
        <button class="btn option-btn" data-group="peeks" data-value="1">1</button>
        <button class="btn option-btn" data-group="peeks" data-value="3">3</button>
        <button class="btn option-btn" data-group="peeks" data-value="5">5</button>

  <div class="row" id="think-row">

  <div id="best-line"></div>
  <button id="start-btn" class="btn">start</button>

<!-- ================= GAME ================= -->
<section id="game" class="screen">
  <div id="hud">
    <span id="time">--:--</span>
    <span id="moves">moves 0</span>
    <span id="score">score 0</span>
  </div>

  <div id="board" style="--n:4"></div>

</section>

  <h2 id="fail-msg">time's up</h2>
  <p id="fail-stats"></p>
  <div class="group">
    <button id="retry-btn" class="btn">retry</button>
    <button id="timeup-new-btn" class="btn">new</button>
    <button id="timeup-menu-btn" class="btn">menu</button>
  </div>
</section>

<script>
/* =====================================================================
   TUNABLE CONFIG - change these values to rebalance the game
   ===================================================================== */
const CONFIG = {
  difficulty: {
    // scramble   = how many moves the scrambler makes
    // smart      = chance (0 to 1) that each scramble move makes the puzzle MORE disordered
    //              (0 = pure random, higher = much harder puzzles)
    // attempts   = how many puzzles are generated; the hardest one is kept
    // moveFactor = move limit = hardness x factor (null = unlimited)
    // idleSecs   = pressure mode: seconds you can stall on a 4x4 before the board moves
    // defMin     = default timer minutes if the custom box has a bad value
    // scoreMult  = score multiplier
    easy: { scramble: 20,  smart: 0,    attempts: 1, moveFactor: null, idleSecs: 15, defMin: 5, scoreMult: 1 },
    hard: { scramble: 80,  smart: 0.35, attempts: 1, moveFactor: 7,    idleSecs: 10, defMin: 3, scoreMult: 2 },
    god:  { scramble: 200, smart: 0.85, attempts: 8, moveFactor: 5.5,  idleSecs: 6,  defMin: 2, scoreMult: 5 }
  },
  blindFadeSecs: 0.6,    // how long the numbers take to fade out
  peekSecs: 1,           // how long a peek shows the numbers
  peekPenalty: 50,       // score lost per peek
  maxLevel: 8,           // level-up mode: highest level
  levelStep: 0.25        // level-up mode: each level adds this much scrambling (0.25 = +25%)
};

/*LOGIC-START*/
/* ===================== BOARD LOGIC =====================
   board[x][y] = tile number, or null for the blank. */
const UP = 'up', DOWN = 'down', LEFT = 'left', RIGHT = 'right';
const OPPOSITE = { up: DOWN, down: UP, left: RIGHT, right: LEFT };

// Solved board: 1..n*n-1 left-to-right, top-to-bottom, blank at the bottom-right.
function startingBoard(n) {
  const b = [];
  for (let x = 0; x < n; x++) {
    b.push([]);
    for (let y = 0; y < n; y++) b[x].push(y * n + x + 1);
  }
  b[n - 1][n - 1] = null;
  return b;
}

function copyBoard(b) { return b.map(col => col.slice()); }
function boardKey(b) { return b.map(col => col.join(',')).join('|'); }
function boardsEqual(a, b) { return a.every((col, x) => col.every((v, y) => v === b[x][y])); }

// Find the blank tile.
function blankPos(b) {
  for (let x = 0; x < b.length; x++)
    for (let y = 0; y < b.length; y++)
      if (b[x][y] === null) return { x, y };
}

// Is this move legal? (a "move" is the direction the neighbouring tile slides)
function isValidMove(b, move) {
  const n = b.length, { x, y } = blankPos(b);
  return (move === UP && y < n - 1) || (move === DOWN && y > 0) ||
         (move === LEFT && x < n - 1) || (move === RIGHT && x > 0);
}

// Swap the blank with the neighbouring tile (does NOT check validity).
function makeMove(b, move) {
  const { x, y } = blankPos(b);
  let tx = x, ty = y;
  if (move === UP) ty = y + 1;
  else if (move === DOWN) ty = y - 1;
  else if (move === LEFT) tx = x + 1;
  else if (move === RIGHT) tx = x - 1;
  [b[x][y], b[tx][ty]] = [b[tx][ty], b[x][y]];
}

// Hardness rating: total distance of every tile from its home square.
// It is the minimum number of moves needed, so a higher number = a harder puzzle.
function manhattan(b) {
  const n = b.length;
  let d = 0;
  for (let x = 0; x < n; x++)
    for (let y = 0; y < n; y++) {
      const v = b[x][y];
      if (v !== null) d += Math.abs(x - (v - 1) % n) + Math.abs(y - Math.floor((v - 1) / n));
    }
  return d;
}

// All legal moves that are not the exact reverse of the last move.
function forwardMoves(b, last) {
  return [UP, DOWN, LEFT, RIGHT].filter(m =>
    isValidMove(b, m) && (!last || m !== OPPOSITE[last]));
}

// What would the hardness be after this move? (tries it, then undoes it)
function hardnessAfter(b, move) {
  makeMove(b, move);
  const d = manhattan(b);
  makeMove(b, OPPOSITE[move]);
  return d;
}

// SMART SCRAMBLE: makes legal moves only (so the puzzle is always solvable) but
//  1. never revisits a board it has already been in (no wasted loops), and
//  2. with probability `smart`, picks a move that pushes tiles further from home.
// A plain random scramble wanders back and forth and stays fairly easy.
// This one walks steadily away from the solved board, so god mode is genuinely hard.
function scramble(n, slides, smart) {
  const b = startingBoard(n);
  const seen = new Set([boardKey(b)]);
  let last = null;
  for (let i = 0; i < slides; i++) {
    let opts = forwardMoves(b, last).map(m => {
      makeMove(b, m);
      const fresh = !seen.has(boardKey(b));
      makeMove(b, OPPOSITE[m]);
      return { m, fresh, d: hardnessAfter(b, m) };
    });
    const fresh = opts.filter(o => o.fresh);
    if (fresh.length) opts = fresh;                       // avoid loops
    let pool = opts;
    if (Math.random() < smart) {
      const best = Math.max(...opts.map(o => o.d));
      pool = opts.filter(o => o.d === best);              // the most disordering moves
    }
    const pick = pool[Math.floor(Math.random() * pool.length)].m;
    makeMove(b, pick);
    seen.add(boardKey(b));
    last = pick;
  }
  return b;
}

// Make a puzzle: try `attempts` scrambles and keep the hardest one.
// Always keeps trying (up to 60 times) if the puzzle came out too easy.
function generatePuzzle(n, slides, smart, attempts) {
  // "too easy" threshold, capped so small boards (which cannot get that hard) don't retry for nothing
  const minHardness = Math.max(4, Math.min(Math.floor(slides * 0.3), n * n * 2));
  let best = null, bestD = -1, tries = 0;
  while (tries < attempts || (bestD < minHardness && tries < 60)) {
    const b = scramble(n, slides, smart);
    const d = manhattan(b);
    if (d > bestD) { best = b; bestD = d; }
    tries++;
  }
  return best;
}
/*LOGIC-END*/

/* ===================== STATE ===================== */
// menu choices
const settings = {
  timerOn: false, preset: 5,
  diff: 'easy', size: 4,
  blind: false, blindSecs: 3, peeks: 3,
  peekSecs: CONFIG.peekSecs, peekCost: CONFIG.peekPenalty,
  think: 0, pressure: false, adaptive: false
};
// current game (null when in menu). g.phase is 'study' (board locked), 'play' or 'over'.
let g = null;
let timerId = null;

const $ = (id) => document.getElementById(id);
const boardEl = $('board');

function setScreen(name) { document.body.dataset.screen = name; }

/* ===================== SCORE =====================
   base      = max(1, hardness x 6 - moves) x 10        fewer moves = higher
   timeBonus = seconds left x 5                         only when the timer is on
   mult      = difficulty x (size x size / 9) x blind x (1 + 0.1 x level) x (pressure ? 1.25 : 1)
   blind     = 1 + 3 / max(3, secondsYouSawTheNumbers)  less viewing time = bigger bonus
   score     = (base + timeBonus) x mult - peeks x penalty      (never below 0) */
function computeScore(moves, timeLeft) {
  const d = CONFIG.difficulty[g.diff];
  const base = Math.max(1, g.rating * 6 - moves) * 10;
  const bonus = (g.timerSecs !== null && timeLeft) ? Math.floor(timeLeft * 5) : 0;
  const blindMult = g.blind ? 1 + 3 / Math.max(3, g.blindSecs) : 1;
  const mult = d.scoreMult * (g.n * g.n) / 9 * blindMult * (1 + 0.1 * g.level) * (g.pressure ? 1.25 : 1);
  return Math.max(0, Math.floor((base + bonus) * mult) - g.peeks * g.peekCost);
}

/* ===================== BEST SCORES (localStorage) ===================== */
// One best score per combination of settings (uses the live game, or the menu choices).
function scoreKey() {
  const s = g || {
    diff: settings.diff, n: settings.size, blind: settings.blind, blindSecs: chosenBlindSecs(),
    maxPeeks: chosenPeeks(), peekSecs: chosenPeekSecs(), peekCost: chosenPeekCost(),
    pressure: settings.pressure, adaptive: settings.adaptive
  };
  return [s.diff, s.n + 'x' + s.n,
    s.blind ? 'blind' + s.blindSecs + 's_' + s.maxPeeks + 'pk_' + s.peekSecs + 's_cost' + s.peekCost : 'normal',
    s.pressure ? 'pressure' : '',
    s.adaptive ? 'levelup' : ''].filter(Boolean).join('_');
}
function loadScores() {
  try { return JSON.parse(localStorage.getItem('slidepuzzle_best_v2')) || {}; }
  catch (e) { return {}; }
}
function saveScore(key, val) {
  try {
    const data = loadScores(); data[key] = val;
    localStorage.setItem('slidepuzzle_best_v2', JSON.stringify(data));
  } catch (e) { /* storage unavailable - ignore */ }
}

/* ===================== MENU ===================== */
// Highlight the selected buttons and show/hide the extra rows.
function renderMenu() {
  const onOff = (v) => v ? 'on' : 'off';
  const sel = {
    timer: onOff(settings.timerOn),
    preset: $('minutes-input').value === '' ? String(settings.preset) : '',
    diff: settings.diff,
    size: String(settings.size),
    blind: onOff(settings.blind),
    blindsecs: $('blind-input').value === '' ? String(settings.blindSecs) : '',
    peeks: $('peeks-input').value === '' ? String(settings.peeks) : '',
    peeksecs: $('peeksecs-input').value === '' ? String(settings.peekSecs) : '',
    peekcost: $('peekcost-input').value === '' ? String(settings.peekCost) : '',
    think: String(settings.think),
    pressure: onOff(settings.pressure),
    adaptive: onOff(settings.adaptive)
  };
  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.classList.toggle('selected', sel[btn.dataset.group] === btn.dataset.value);
  });
  $('minutes-row').classList.toggle('hidden', !settings.timerOn);
  $('blind-rows').classList.toggle('hidden', !settings.blind);
  $('think-row').classList.toggle('hidden', settings.blind);   // blind mode already has its own locked study time

  const best = loadScores()[scoreKey()];
  $('best-line').textContent = best !== undefined ? `best  ${best}` : '';
}

document.querySelectorAll('.option-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const v = btn.dataset.value, on = (v === 'on');
    switch (btn.dataset.group) {
      case 'timer':     settings.timerOn = on; break;
      case 'preset':    settings.preset = parseInt(v, 10); $('minutes-input').value = ''; break;
      case 'diff':      settings.diff = v; break;
      case 'size':      settings.size = parseInt(v, 10); break;
      case 'blind':     settings.blind = on; break;
      case 'blindsecs': settings.blindSecs = parseInt(v, 10); $('blind-input').value = ''; break;
      case 'peeks':     settings.peeks = parseInt(v, 10); $('peeks-input').value = ''; break;
      case 'peeksecs':  settings.peekSecs = parseFloat(v); $('peeksecs-input').value = ''; break;
      case 'peekcost':  settings.peekCost = parseInt(v, 10); $('peekcost-input').value = ''; break;
      case 'think':     settings.think = parseInt(v, 10); break;
      case 'pressure':  settings.pressure = on; break;
      case 'adaptive':  settings.adaptive = on; break;
    }
    renderMenu();
  });
});
$('minutes-input').addEventListener('input', renderMenu);
$('blind-input').addEventListener('input', renderMenu);
$('peeks-input').addEventListener('input', renderMenu);
$('peeksecs-input').addEventListener('input', renderMenu);
$('peekcost-input').addEventListener('input', renderMenu);

// Timer length in seconds (null = timer off). Bad input falls back to a default.
function chosenTimerSecs() {
  if (!settings.timerOn) return null;
  let mins = parseInt($('minutes-input').value, 10);
  if (isNaN(mins) || mins <= 0) {
    mins = $('minutes-input').value === '' ? settings.preset : CONFIG.difficulty[settings.diff].defMin;
  }
  return Math.min(mins, 99) * 60;
}

// Seconds the numbers stay visible in blind mode (1 to 60).
function chosenBlindSecs() {
  const v = parseInt($('blind-input').value, 10);
  return (!isNaN(v) && v > 0) ? Math.min(v, 60) : settings.blindSecs;
}

// Custom peek settings: a typed value wins, a bad or empty box falls back to the chosen button.
function chosenPeeks() {                           // peeks per game (0 to 50)
  const v = parseInt($('peeks-input').value, 10);
  return (!isNaN(v) && v >= 0) ? Math.min(v, 50) : settings.peeks;
}
function chosenPeekSecs() {                        // how long one peek lasts (0.5 to 10 seconds)
  const v = parseFloat($('peeksecs-input').value);
  return (!isNaN(v) && v > 0) ? Math.min(Math.max(v, 0.5), 10) : settings.peekSecs;
}
function chosenPeekCost() {                        // score lost per peek (0 to 1000)
  const v = parseInt($('peekcost-input').value, 10);
  return (!isNaN(v) && v >= 0) ? Math.min(v, 1000) : settings.peekCost;
}

/* ===================== GAME SETUP ===================== */
function startGame() {
  const blindSecs = chosenBlindSecs();
  g = {
    n: settings.size,
    diff: settings.diff,
    blind: settings.blind,
    blindSecs,
    maxPeeks: chosenPeeks(),
    peekSecs: chosenPeekSecs(),
    peekCost: chosenPeekCost(),
    studySecs: settings.blind ? blindSecs : settings.think,   // locked "look and plan" time before the clock starts
    pressure: settings.pressure,
    adaptive: settings.adaptive,
    level: 0,
    timerSecs: chosenTimerSecs(),
    board: null, initial: null, rating: 0, moveLimit: null, idleSecs: 10,
    moves: 0, peeks: 0, peeking: false,
    phase: 'study', studyEnd: 0, startTime: 0, lastAction: 0,
    notice: null, drag: null, tiles: {}
  };
  newPuzzle();
  buildTiles();
}

// Generate a fresh puzzle with the same settings (level-up mode makes it harder).
function newPuzzle() {
  const d = CONFIG.difficulty[g.diff];
  const slides = Math.round(d.scramble * (1 + CONFIG.levelStep * g.level));
  const smart = Math.min(0.95, d.smart + 0.05 * g.level);
  g.board = generatePuzzle(g.n, slides, smart, d.attempts);
  g.initial = copyBoard(g.board);
  g.rating = manhattan(g.board);
  g.moveLimit = d.moveFactor ? Math.ceil(g.rating * d.moveFactor) : null;
  g.idleSecs = Math.max(3, +(d.idleSecs * g.n / 4 - 0.5 * g.level).toFixed(1));
  resetRun();
}

// Reset counters and timers (keeps the current puzzle).
function resetRun() {
  g.moves = 0; g.peeks = 0; g.peeking = false; g.drag = null; g.notice = null;
  boardEl.classList.remove('solved', 'blind', 'peek');
  clearAllOffsets();
  const now = performance.now();
  g.lastAction = now;
  if (g.studySecs > 0) {
    g.phase = 'study'; g.studyEnd = now + g.studySecs * 1000; g.startTime = 0;
  } else {
    g.phase = 'play'; g.startTime = now;
    if (g.blind) boardEl.classList.add('blind');
  }
  setScreen('game');
  render();
  updateHud();
  startLoop();
}

function restartGame() { if (!g) return; g.board = copyBoard(g.initial); resetRun(); }
function newGame() { if (g) newPuzzle(); }

// End the locked study phase and start the clock.
function beginPlay() {
  if (!g || g.phase !== 'study') return;
  const now = performance.now();
  g.phase = 'play'; g.startTime = now; g.lastAction = now;
  if (g.blind) boardEl.classList.add('blind');      // numbers fade out
  updateHud();
}

// Create one DOM tile per number (kept between moves so CSS can animate them).
function buildTiles() {
  boardEl.innerHTML = '';
  boardEl.style.setProperty('--n', g.n);
  g.tiles = {};
  for (let num = 1; num < g.n * g.n; num++) {
    const t = document.createElement('div');
    t.className = 'tile';
    t.dataset.num = num;
    t.innerHTML = '<div class="tile-face"><span class="tile-number">' + num + '</span></div>';
    boardEl.appendChild(t);
    g.tiles[num] = t;
  }
  $('peek-btn').classList.toggle('hidden', !(g.blind && g.maxPeeks > 0));
  $('pressure').classList.toggle('hidden', !g.pressure);
  render();
  updateHud();
}

// Move every tile to its board position (CSS transition does the sliding).
function render() {
  for (let x = 0; x < g.n; x++)
    for (let y = 0; y < g.n; y++) {
      const v = g.board[x][y];
      if (v !== null && g.tiles[v]) {
        g.tiles[v].style.setProperty('--x', x);
        g.tiles[v].style.setProperty('--y', y);
      }
    }
}

/* ===================== MOVES ===================== */
function elapsedSecs() { return g.phase === 'play' ? (performance.now() - g.startTime) / 1000 : 0; }
function timeLeftSecs() { return g.timerSecs === null ? null : g.timerSecs - elapsedSecs(); }

// Apply `k` identical moves in one go (a whole row or column sliding), then check the result.
function doSlides(move, k) {
  for (let i = 0; i < k; i++) makeMove(g.board, move);
  g.moves += k;
  g.lastAction = performance.now();
  render();
  afterMove();
}

function afterMove() {
  if (boardsEqual(g.board, startingBoard(g.n))) { winGame(); return; }
  if (g.moveLimit && g.moves >= g.moveLimit) { loseGame('no moves left'); return; }
  updateHud();
}

// One tile slides (keyboard and swipe use this).
function slide(move) {
  if (!g || g.phase !== 'play' || !isValidMove(g.board, move)) return;
  doSlides(move, 1);
}

// Pressure mode: the board makes its own (worst) legal move.
function autoMove() {
  const opts = [UP, DOWN, LEFT, RIGHT].filter(m => isValidMove(g.board, m))
    .map(m => ({ m, d: hardnessAfter(g.board, m) }));
  const worst = Math.max(...opts.map(o => o.d));
  const pool = opts.filter(o => o.d === worst);
  makeMove(g.board, pool[Math.floor(Math.random() * pool.length)].m);
  g.lastAction = performance.now();
  g.notice = { text: 'the board moved. think faster', until: performance.now() + 1500 };
  render();
  if (boardsEqual(g.board, startingBoard(g.n))) winGame(); else updateHud();
}

// Show the numbers for a moment (blind mode only, limited uses, costs score).
function peek() {
  if (!g || g.phase !== 'play' || !g.blind || g.peeking || g.peeks >= g.maxPeeks) return;
  g.peeks++;
  g.peeking = true;
  boardEl.classList.add('peek');
  updateHud();
  setTimeout(() => {
    boardEl.classList.remove('peek');
    if (g) g.peeking = false;
  }, g.peekSecs * 1000);
}

/* ===================== DRAG, TAP AND SWIPE =====================
   - drag a tile next to the blank (or any tile in the same row/column: the whole line moves)
   - tap a tile to slide it
   - swipe anywhere else on the board to slide a tile in that direction */
function cellSize() { return boardEl.clientWidth / g.n; }

// If this tile is in the same row/column as the blank, describe the slide it can make.
function lineInfo(num) {
  let tx = -1, ty = -1;
  for (let x = 0; x < g.n; x++)
    for (let y = 0; y < g.n; y++) if (g.board[x][y] === num) { tx = x; ty = y; }
  const { x: bx, y: by } = blankPos(g.board);
  const nums = [];
  let move;
  if (tx === bx && ty !== by) {
    move = by < ty ? UP : DOWN;
    const s = Math.sign(ty - by);
    for (let y = by + s; ; y += s) { nums.push(g.board[tx][y]); if (y === ty) break; }
  } else if (ty === by && tx !== bx) {
    move = bx < tx ? LEFT : RIGHT;
    const s = Math.sign(tx - bx);
    for (let x = bx + s; ; x += s) { nums.push(g.board[x][ty]); if (x === tx) break; }
  } else return null;
  const v = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[move];
  return { move, k: nums.length, ux: v[0], uy: v[1], els: nums.map(n => g.tiles[n]) };
}

function setOffset(info, px) {
  info.els.forEach(el => {
    el.style.setProperty('--dx', (px * info.ux) + 'px');
    el.style.setProperty('--dy', (px * info.uy) + 'px');
  });
}
function clearOffset(info) {                       // springs back with the CSS transition
  info.els.forEach(el => el.classList.remove('dragging'));
  setOffset(info, 0);
}
function clearAllOffsets() {
  Object.values(g.tiles).forEach(el => {
    el.classList.remove('dragging');
    el.style.setProperty('--dx', '0px');
    el.style.setProperty('--dy', '0px');
  });
}

// Finish a slide: the tiles continue from where the finger left them.
function commitLine(info, progress) {
  const cell = cellSize();
  info.els.forEach(el => el.classList.add('dragging'));
  setOffset(info, progress * cell - cell);         // new grid position minus one cell = same spot on screen
  doSlides(info.move, info.k);
  void boardEl.offsetWidth;                        // let the browser register that position
  info.els.forEach(el => el.classList.remove('dragging'));
  setOffset(info, 0);                              // now animate the rest of the way
}

boardEl.addEventListener('pointerdown', (e) => {
  if (!g || g.phase !== 'play' || g.drag) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const el = e.target.closest('.tile');
  g.drag = {
    id: e.pointerId, x0: e.clientX, y0: e.clientY, t0: performance.now(),
    info: el ? lineInfo(Number(el.dataset.num)) : null, progress: 0, moved: false
  };
  try { boardEl.setPointerCapture(e.pointerId); } catch (err) { /* not supported - fine */ }
});

boardEl.addEventListener('pointermove', (e) => {
  if (!g || !g.drag || e.pointerId !== g.drag.id) return;
  const dr = g.drag;
  g.lastAction = performance.now();
  if (!dr.info) return;
  const dx = e.clientX - dr.x0, dy = e.clientY - dr.y0;
  if (!dr.moved && Math.hypot(dx, dy) > 4) {
    dr.moved = true;
    dr.info.els.forEach(el => el.classList.add('dragging'));
  }
  if (dr.moved) {
    const cell = cellSize();
    dr.progress = Math.max(0, Math.min(1, (dx * dr.info.ux + dy * dr.info.uy) / cell));
    setOffset(dr.info, dr.progress * cell);
  }
});

function endDrag(e, cancelled) {
  if (!g || !g.drag || e.pointerId !== g.drag.id) return;
  const dr = g.drag;
  g.drag = null;
  try { boardEl.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  if (cancelled || g.phase !== 'play') { if (dr.info) clearOffset(dr.info); return; }

  const dx = e.clientX - dr.x0, dy = e.clientY - dr.y0;
  const dist = Math.hypot(dx, dy), dt = performance.now() - dr.t0;
  if (dr.info) {
    const tap = dist < 8 && dt < 600;
    const flick = dt < 250 && dr.progress > 0.08;
    if (tap || flick || dr.progress >= 0.3) commitLine(dr.info, tap ? 0 : dr.progress);
    else clearOffset(dr.info);
  } else if (dist >= 24) {
    const horizontal = Math.abs(dx) > Math.abs(dy);
    slide(horizontal ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP));
  }
}
boardEl.addEventListener('pointerup', (e) => endDrag(e, false));
boardEl.addEventListener('pointercancel', (e) => endDrag(e, true));

/* ===================== HUD AND TIMER LOOP ===================== */
function formatTime(secs) {
  secs = Math.max(0, Math.floor(secs));
  return String(Math.floor(secs / 60)).padStart(2, '0') + ':' + String(secs % 60).padStart(2, '0');
}

function infoText(now) {
  if (g.notice && now < g.notice.until) return g.notice.text;
  const parts = [];
  if (g.phase === 'study') {
    const left = Math.max(0, Math.ceil((g.studyEnd - now) / 1000));
    parts.push((g.blind ? 'memorise ' : 'plan ') + left + 's');
  }
  parts.push('hardness ' + g.rating);
  if (g.adaptive) parts.push('lv ' + g.level);
  if (g.phase === 'play' && g.blind) parts.push('peeks ' + g.peeks + '/' + g.maxPeeks);
  return parts.join(' · ');
}

// Refresh the HUD text.
function updateHud() {
  if (!g) return;
  const now = performance.now();
  const tl = timeLeftSecs();
  const timeEl = $('time');
  if (tl === null) {
    timeEl.textContent = formatTime(elapsedSecs());          // timer off: count up, just for info
    timeEl.classList.remove('low');
  } else {
    timeEl.textContent = formatTime(Math.ceil(tl));
    timeEl.classList.toggle('low', tl <= 30 && g.phase === 'play');
  }
  $('moves').textContent = 'moves ' + g.moves + (g.moveLimit ? ' / ' + g.moveLimit : '');
  $('score').textContent = 'score ' + computeScore(g.moves, tl === null ? 0 : Math.max(0, tl));

  const info = $('info');
  info.textContent = infoText(now);
  info.classList.toggle('study', g.phase === 'study');
  $('go-btn').classList.toggle('hidden', g.phase !== 'study');

  if (g.pressure) {
    const pct = g.phase === 'play' ? Math.min(100, (now - g.lastAction) / 10 / g.idleSecs) : 0;
    $('pressure-bar').style.width = pct + '%';
    $('pressure').classList.toggle('hot', pct > 66);
  }
}

// Runs ~10 times per second: study countdown, game timer, pressure mode, HUD.
function startLoop() {
  clearInterval(timerId);
  timerId = setInterval(() => {
    if (!g || g.phase === 'over') return;
    const now = performance.now();
    if (g.phase === 'study') {
      if (now >= g.studyEnd) beginPlay(); else updateHud();
      return;
    }
    const tl = timeLeftSecs();
    if (tl !== null && tl <= 0) { loseGame("time's up"); return; }
    if (g.drag) g.lastAction = now;                          // never move the board under your finger
    if (g.pressure && (now - g.lastAction) / 1000 >= g.idleSecs) autoMove();
    if (g.phase === 'play') updateHud();
  }, 100);
}

function stopLoop() { clearInterval(timerId); timerId = null; }

/* ===================== END OF GAME ===================== */
// How efficiently did you solve it? Compares your moves with the minimum possible.
function efficiencyLabel(ratio) {
  if (ratio < 1.8) return 'genius';
  if (ratio < 2.8) return 'sharp';
  if (ratio < 4.5) return 'solid';
  return 'brute force';
}

function winGame() {
  const tl = timeLeftSecs();
  const secs = elapsedSecs();
  const score = computeScore(g.moves, tl === null ? 0 : Math.max(0, tl));
  g.phase = 'over'; stopLoop();

  const key = scoreKey();
  const best = loadScores()[key];
  const isBest = best === undefined || score > best;
  if (isBest) saveScore(key, score);

  const ratio = g.moves / Math.max(1, g.rating);
  let rating = efficiencyLabel(ratio) + ' · ' + ratio.toFixed(1) + 'x the minimum moves';
  if (g.adaptive) {
    g.level = Math.min(CONFIG.maxLevel, g.level + 1);
    rating += ' · next: level ' + g.level;
  }
  boardEl.classList.remove('blind', 'peek');
  boardEl.classList.add('solved');
  $('final-score').textContent = 'score ' + score;
  $('new-best').classList.toggle('hidden', !isBest);
  $('final-stats').textContent = 'moves ' + g.moves + '  ·  time ' + formatTime(secs);
  $('final-rating').textContent = rating;
  setScreen('solved');
}

function loseGame(reason) {
  g.phase = 'over'; stopLoop();
  let stats = 'moves ' + g.moves;
  if (g.adaptive) {
    g.level = Math.max(0, g.level - 1);
    stats += '  ·  next: level ' + g.level;
  }
  $('fail-msg').textContent = reason;
  $('fail-stats').textContent = stats;
  setScreen('timeup');
}

function goMenu() {
  if (g) g.phase = 'over';
  stopLoop();
  g = null;
  renderMenu();
  setScreen('menu');
}

/* ===================== BUTTONS ===================== */
$('start-btn').addEventListener('click', startGame);
$('go-btn').addEventListener('click', beginPlay);
$('restart-btn').addEventListener('click', restartGame);
$('new-btn').addEventListener('click', newGame);
$('peek-btn').addEventListener('click', peek);
$('menu-btn').addEventListener('click', goMenu);
$('again-btn').addEventListener('click', newGame);
$('solved-menu-btn').addEventListener('click', goMenu);
$('retry-btn').addEventListener('click', restartGame);
$('timeup-new-btn').addEventListener('click', newGame);
$('timeup-menu-btn').addEventListener('click', goMenu);

// After tapping a game button, drop focus so Space and Enter go to the game, not the button.
document.addEventListener('click', (e) => {
  const b = e.target.closest('.btn');
  if (b && b.closest('#game, .overlay')) b.blur();
});

/* ===================== KEYBOARD ===================== */
document.addEventListener('keydown', (e) => {
  if (!g) return;                                   // keys only matter in a game
  if (e.target && e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();

  if (k === 'escape') { goMenu(); return; }
  if (k === 'n') { newGame(); return; }
  if (k === 'r') { restartGame(); return; }
  if (document.body.dataset.screen !== 'game') return;

  if (k === ' ' || k === 'enter') {                 // go (while studying) or peek (while playing)
    e.preventDefault();
    if (g.phase === 'study') beginPlay(); else peek();
    return;
  }
  const map = { arrowleft: LEFT, a: LEFT, arrowright: RIGHT, d: RIGHT,
                arrowup: UP, w: UP, arrowdown: DOWN, s: DOWN };
  if (map[k]) { e.preventDefault(); slide(map[k]); }
});

/* ===================== INIT ===================== */
document.documentElement.style.setProperty('--fade', CONFIG.blindFadeSecs + 's');
renderMenu();
</script>
</body>
</html>
